server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: user-service-route
          uri: lb://user-service
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**

        - id: tour-service-route
          uri: lb://tour-service
          predicates:
            - Path=/api/v1/tours/**, /api/v1/operator/tours/**

        - id: hotel-service-route
          uri: lb://hotel-service
          predicates:
            - Path=/api/v1/hotels/**, /api/v1/manager/hotels/**

        - id: payment-service-route
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/wallet/**, /api/v1/payments/**

        - id: booking-service-route
          uri: lb://booking-service
          predicates:
            - Path=/api/v1/bookings/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
